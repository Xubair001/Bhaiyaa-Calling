# Robolectric instantiates the real Application class by default. For this app
# that means BhaiyaaaApplication.onCreate runs before every test: it creates
# notification channels, seeds the database and enqueues WorkManager jobs.
#
# WorkManager's threads then outlive the test sandbox and throw
#   NullPointerException: Cannot invoke ActivityThread.getInstrumentation()
# on the way down. That is an *uncaught* exception, so kotlinx-coroutines-test
# reports it against whichever test happens to run next, as
# UncaughtExceptionsBeforeTest - a failure with no connection to the test named
# in it, which is why it looked flaky and moved around.
#
# Unit tests here exercise DAOs, calculators and pure logic. None of them want
# the production startup path, so the stock Application is used instead.
application=android.app.Application
sdk=33
