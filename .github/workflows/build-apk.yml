name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The Gradle wrapper is committed, so the build uses a pinned Gradle
      # version rather than whatever happens to be on the runner image.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      # Instrumented tests need a device, which this workflow doesn't provision.
      # Compiling them still catches breakage in the UI test sources.
      - name: Compile instrumented tests
        run: ./gradlew assembleDebugAndroidTest --stacktrace

      - name: Build debug APKs
        run: ./gradlew assembleDebug --stacktrace

      # Vosk ships one native library per CPU architecture, so the build emits
      # a per-ABI APK plus a universal one. Asking a human to know their phone's
      # CPU before installing is a bad trade, so the default artifact holds a
      # single file that always installs, and the smaller per-ABI builds are a
      # separate, clearly-labelled download.
      - name: Stage the install-me APK
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/debug/app-universal-debug.apk \
             artifact/BHAIYAAA-install-this.apk
          ls -lh artifact/

      - name: Upload APK (install this one)
        uses: actions/upload-artifact@v4
        with:
          name: bhaiyaaa-apk
          path: artifact/BHAIYAAA-install-this.apk
          if-no-files-found: error

      - name: Upload smaller per-architecture APKs
        uses: actions/upload-artifact@v4
        with:
          name: bhaiyaaa-apk-per-architecture
          # Roughly half the size, but you must match your phone's CPU:
          # arm64-v8a for any modern phone, armeabi-v7a for older 32-bit ARM,
          # x86_64 for emulators.
          path: |
            app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
            app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk
            app/build/outputs/apk/debug/app-x86_64-debug.apk
          if-no-files-found: error

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Android Lint
        run: ./gradlew lintDebug --stacktrace
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
